<picture>
  <source type="image/webp"
          sizes="100vw"
          srcset="/src/images/{{ project }}/{{ project }}-ribbon.png?as=webp&width=400 400w,
                  /src/images/{{ project }}/{{ project }}-ribbon.png?as=webp&width=800 800w,
                  /src/images/{{ project }}/{{ project }}-ribbon.png?as=webp&width=1600 1600w,
                  /src/images/{{ project }}/{{ project }}-ribbon.png?as=webp&width=3200 3200w">
  <img src="/src/images/{{ project }}/{{ project }}-ribbon.png?width=800"
       srcset="/src/images/{{ project }}/{{ project }}-ribbon.png?width=400 400w,
               /src/images/{{ project }}/{{ project }}-ribbon.png?width=800 800w,
               /src/images/{{ project }}/{{ project }}-ribbon.png?width=1600 1600w,
               /src/images/{{ project }}/{{ project }}-ribbon.png?width=3200 3200w"
       sizes="100vw"
       alt="{{ alt }}">
</picture>
